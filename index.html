<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kare</title>
  <meta name="description" content="Kare: write a worry into the sand and let it pass.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e7dfd4;
      color: #43382f;
      font: 18px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 36rem; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; }
    h1 { font-weight: 500; font-size: 2.2rem; line-height: 1.2; margin: 0 0 0.25rem; }
    h2 { font-weight: 500; font-size: 1.5rem; line-height: 1.3; margin: 2.25rem 0 0.5rem; }
    p, li { margin: 0 0 0.9rem; }
    ul { padding-left: 1.2rem; }
    a { color: #43382f; text-decoration-color: #94877a; text-underline-offset: 0.15em; }
    .quiet { color: #7b6d60; font-style: italic; }
    .small { font-size: 0.85rem; color: #7b6d60; font-family: Menlo, ui-monospace, monospace; letter-spacing: 0.04em; }
    footer { margin-top: 3rem; }
  </style>
</head>
<body>
  <main>
    <h1>Kare</h1>
    <p class="quiet">Write a worry into the sand, and let it pass.</p>
    <p>Kare is a small sand garden for your phone. A thought written into it is slowly raked away, and once it has passed, its words are gone.</p>
    <p><a href="/privacy/">Privacy policy</a></p>
  </main>
</body>
</html>
